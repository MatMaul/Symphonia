[package]
name = "symphonia-metadata"
description = "Project Symphonia multimedia tag and metadata readers."
authors = ["Philip Deljanov <philip.deljanov@gmail.com>"]
readme = "README.md"
categories = ["multimedia", "multimedia::audio", "multimedia::encoding"]
keywords = ["multimedia", "media", "metadata", "id3v1", "id3v2"]
# Common package metadata located in workspace Cargo.toml.
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
default = ["std", "ape", "id3v1", "id3v2"]

std = [
    "log/std",
    "symphonia-core/std",
]

ape = []
flac = ["vorbis"]
id3v1 = []
id3v2 = []
riff-info = ["id3v2"]
vorbis = ["flac"]

# Enable all RIFF metadata formats.
riff = [
    "riff-info",
]

[dependencies]
hashbrown = { version = "0.16", default-features = false, features = ["alloc"] }
lazy_static = { version = "1.4.0", default-features = false, features = ["spin_no_std"] }
log = { version = "0.4", default-features = false }
smallvec = "1.13.1"
symphonia-core = { version = "0.6.0", path = "../symphonia-core", default-features = false }
